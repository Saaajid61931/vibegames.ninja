<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Body -->
  <rect x="4" y="3" width="24" height="26" rx="3" fill="#1e1e2e" stroke="#2a2a3e" stroke-width="0.5"/>
  
  <!-- Headband -->
  <rect x="4" y="3" width="24" height="5" rx="3" fill="#6366f1"/>
  <rect x="4" y="5" width="24" height="3" fill="#6366f1"/>
  
  <!-- Headband tails -->
  <path d="M25 5 L31 4 L28 5 L31 6 Z" fill="#6366f1"/>
  
  <!-- Screen -->
  <rect x="7" y="9" width="18" height="11" rx="2" fill="#0f0f1a" stroke="#1a1a2e" stroke-width="0.5"/>
  
  <!-- Happy eyes - curved like upside-down U -->
  <path d="M10 14 Q12 12 14 14" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M18 14 Q20 12 22 14" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none"/>
  
  <!-- Gentle smile -->
  <path d="M12 17 Q16 20 20 17" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  
  <!-- Cheek highlights -->
  <circle cx="9" cy="15" r="0.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="23" cy="15" r="0.5" fill="#ffffff" opacity="0.3"/>
  
  <!-- D-pad -->
  <rect x="8" y="23" width="6" height="1.5" rx="0.4" fill="#3a3a50"/>
  <rect x="10.25" y="20.75" width="1.5" height="6" rx="0.4" fill="#3a3a50"/>
  
  <!-- Action buttons -->
  <circle cx="22" cy="23" r="1.3" fill="#6366f1"/>
  <circle cx="25" cy="25" r="1.3" fill="#818cf8"/>
</svg>
