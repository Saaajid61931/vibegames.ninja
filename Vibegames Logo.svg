<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <style>
      /* Hardware-accelerated smooth animations */
      @keyframes float-stance {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        20%, 30% { transform: translateY(-8px) rotate(0deg); }
        45%, 95% { transform: translateY(12px) rotate(4deg); }
        50%, 90% { transform: translateY(12px) rotate(2deg); }
      }
      
      @keyframes float-shadow {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        20%, 30% { transform: scale(0.85); opacity: 0.3; }
        45%, 95% { transform: scale(1.1); opacity: 0.7; }
      }

      @keyframes fade-relax {
        0%, 40%, 100% { opacity: 1; }
        45%, 95% { opacity: 0; }
      }

      @keyframes fade-attack {
        0%, 40%, 100% { opacity: 0; }
        45%, 95% { opacity: 1; }
      }

      @keyframes screen-bg-anim {
        0%, 40%, 100% { fill: #0B2129; }
        45%, 95% { fill: #2B0A16; }
      }

      @keyframes screen-glow-anim {
        0%, 40%, 100% { stop-color: #00E5FF; }
        45%, 95% { stop-color: #FF0055; }
      }

      @keyframes blink-relax {
        0%, 46%, 49%, 100% { transform: scaleY(1); }
        47.5% { transform: scaleY(0.1); }
      }

      @keyframes blink-attack {
        0%, 65%, 68%, 100% { transform: scaleY(1); }
        66.5% { transform: scaleY(0.1); }
      }

      @keyframes headband-wave-1 {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg); }
        45%, 95% { transform: rotate(-35deg) scale(1.3); }
        70% { transform: rotate(-25deg) scale(1.35); }
      }

      @keyframes headband-wave-2 {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(5deg); }
        45%, 95% { transform: rotate(-20deg) scale(1.2); }
        70% { transform: rotate(-10deg) scale(1.25); }
      }

      @keyframes aura-pulse {
        0%, 40%, 100% { opacity: 0; transform: scale(0.9); }
        45%, 95% { opacity: 0.4; transform: scale(1.1); }
        70% { opacity: 0.6; transform: scale(1.15); }
      }

      /* Class Assignments */
      .bmo-wrapper {
        animation: float-stance 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: 200px 250px;
      }
      .bmo-shadow {
        animation: float-shadow 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: 200px 450px;
      }
      .face-relax {
        animation: fade-relax 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .eyes-relax {
        animation: blink-relax 4s infinite;
        transform-origin: 200px 165px;
      }
      .face-attack {
        animation: fade-attack 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .eyes-attack {
        animation: blink-attack 4s infinite;
        transform-origin: 200px 165px;
      }
      .screen-bg {
        animation: screen-bg-anim 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .aura {
        animation: aura-pulse 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: 200px 250px;
      }
      .hb-tail-1 {
        animation: headband-wave-1 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: 105px 125px;
      }
      .hb-tail-2 {
        animation: headband-wave-2 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: 105px 125px;
      }
      .glow-stop {
        animation: screen-glow-anim 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Typography Styles */
      .font-vibe {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 86px;
        font-style: italic;
        fill: url(#brand-grad);
        text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
      }
      .font-games {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 86px;
        font-style: italic;
        fill: #FFFFFF;
      }
      .font-ninja {
        font-family: 'Courier New', Courier, monospace;
        font-size: 42px;
        font-weight: 900;
        fill: #00E5FF;
        letter-spacing: 6px;
      }
    </style>

    <!-- Gradients & Filters -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#AA00FF"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>

    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5" class="glow-stop"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" class="glow-stop"/>
    </radialGradient>

    <linearGradient id="katana-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>

    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Body -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#0D1117"/>
  
  <!-- Subtle Grid Background -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" stroke-dasharray="20 20">
    <path d="M0 100 h850 M0 200 h850 M0 300 h850 M0 400 h850"/>
    <path d="M100 0 v500 M200 0 v500 M300 0 v500 M400 0 v500 M500 0 v500 M600 0 v500 M700 0 v500 M800 0 v500"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="450" rx="90" ry="15" fill="#000000" class="bmo-shadow"/>

  <!-- ========================================== -->
  <!-- LEFT: NINJA BMO CHARACTER                  -->
  <!-- ========================================== -->
  
  <!-- Attack Aura (Behind BMO) -->
  <circle cx="200" cy="250" r="140" fill="url(#screen-glow)" class="aura" style="mix-blend-mode: screen;"/>

  <g class="bmo-wrapper" filter="url(#drop-shadow)">
    
    <!-- Crossed Katanas on Back -->
    <g id="katanas">
      <!-- Katana 1 (Top Left to Bottom Right) -->
      <g transform="translate(200, 240) rotate(45)">
        <rect x="-130" y="-8" width="200" height="16" fill="url(#katana-blade)" rx="2"/>
        <path d="M 70 -8 L 100 0 L 70 8 Z" fill="#E2E8F0"/>
        <rect x="-150" y="-12" width="20" height="24" fill="#1A202C" rx="4"/>
        <rect x="-140" y="-14" width="8" height="28" fill="#FF0055" rx="2"/>
        <rect x="-60" y="-12" width="8" height="24" fill="#FF0055"/>
      </g>
      <!-- Katana 2 (Top Right to Bottom Left) -->
      <g transform="translate(200, 240) rotate(135)">
        <rect x="-130" y="-8" width="200" height="16" fill="url(#katana-blade)" rx="2"/>
        <path d="M 70 -8 L 100 0 L 70 8 Z" fill="#E2E8F0"/>
        <rect x="-150" y="-12" width="20" height="24" fill="#1A202C" rx="4"/>
        <rect x="-140" y="-14" width="8" height="28" fill="#00E5FF" rx="2"/>
        <rect x="-60" y="-12" width="8" height="24" fill="#00E5FF"/>
      </g>
    </g>

    <!-- Limbs -->
    <g id="limbs" stroke="#1A202C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Arm -->
      <path d="M 110 260 L 60 290 L 70 240" fill="none"/>
      <!-- Right Arm -->
      <path d="M 290 260 L 330 220" fill="none"/>
      <!-- Left Leg -->
      <path d="M 160 380 L 160 420 L 140 420" fill="none"/>
      <!-- Right Leg -->
      <path d="M 240 380 L 240 410 L 260 410" fill="none"/>
    </g>

    <!-- Main Chassis -->
    <rect x="110" y="110" width="180" height="270" rx="25" fill="#1A202C" stroke="#2D3748" stroke-width="6"/>
    
    <!-- Top Detail Lines -->
    <rect x="130" y="115" width="40" height="6" rx="3" fill="#4A5568"/>
    <rect x="230" y="115" width="40" height="6" rx="3" fill="#4A5568"/>

    <!-- The Screen -->
    <rect x="130" y="140" width="140" height="110" rx="12" class="screen-bg" stroke="#0D1117" stroke-width="8"/>
    
    <!-- Screen Glare -->
    <path d="M 134 144 L 266 144 L 160 246 L 134 246 Z" fill="#FFFFFF" opacity="0.05"/>

    <!-- Ninja Mask (Covers lower half of the screen and chassis) -->
    <path d="M 110 190 Q 200 205 290 190 L 290 260 Q 200 275 110 260 Z" fill="#0D1117"/>
    <path d="M 130 194 Q 200 207 270 194 L 270 246 Q 200 256 130 246 Z" fill="#000000"/>
    <!-- Mask Fold Lines -->
    <path d="M 160 198 L 180 240 M 240 198 L 220 240" stroke="#1A202C" stroke-width="4" stroke-linecap="round"/>

    <!-- Headband (Hachimaki) -->
    <g id="headband">
      <rect x="110" y="120" width="180" height="22" fill="#FF0055"/>
      <rect x="110" y="136" width="180" height="6" fill="#CC0044"/>
      
      <!-- Headband Knot & Tails (Left Side) -->
      <circle cx="105" cy="131" r="10" fill="#FF0055"/>
      
      <!-- Flowing Tails with independent animations -->
      <path d="M 105 131 Q 60 110 10 150 Q 50 145 105 138 Z" fill="#FF0055" class="hb-tail-1"/>
      <path d="M 105 131 Q 70 150 20 180 Q 70 160 105 140 Z" fill="#CC0044" class="hb-tail-2"/>
    </g>

    <!-- ================= FACES ================= -->

    <!-- RELAXED FACE (Cyan) -->
    <g class="face-relax">
      <g class="eyes-relax" fill="#00E5FF">
        <!-- Left Eye -->
        <ellipse cx="170" cy="165" rx="8" ry="12"/>
        <!-- Right Eye -->
        <ellipse cx="230" cy="165" rx="8" ry="12"/>
      </g>
      <!-- Cute Kawaii Blush -->
      <ellipse cx="150" cy="175" rx="6" ry="4" fill="#00E5FF" opacity="0.4"/>
      <ellipse cx="250" cy="175" rx="6" ry="4" fill="#00E5FF" opacity="0.4"/>
    </g>

    <!-- ATTACK FACE (Magenta/Red) -->
    <g class="face-attack">
      <g class="eyes-attack" fill="#FF0055">
        <!-- Sharp Left Eye -->
        <path d="M 155 155 L 185 168 L 160 174 Z"/>
        <!-- Sharp Right Eye -->
        <path d="M 245 155 L 215 168 L 240 174 Z"/>
        <!-- Cybernetic Target Reticle -->
        <circle cx="200" cy="165" r="30" fill="none" stroke="#FF0055" stroke-width="2" opacity="0.3" stroke-dasharray="8 4"/>
      </g>
      <!-- Intense Glowing Under-Eye Marks -->
      <path d="M 160 180 L 150 190 M 240 180 L 250 190" stroke="#FF0055" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- ================= HARDWARE BUTTONS ================= -->
    <g id="controls">
      <!-- Shuriken D-Pad -->
      <g transform="translate(155, 310)">
        <path d="M 0 -25 L 6 -8 L 25 0 L 6 8 L 0 25 L -6 8 L -25 0 L -6 -8 Z" fill="#00E5FF"/>
        <path d="M 0 -15 L 4 -4 L 15 0 L 4 4 L 0 15 L -4 4 L -15 0 L -4 -4 Z" fill="#E6FFFF"/>
        <circle cx="0" cy="0" r="4" fill="#1A202C"/>
      </g>
      
      <!-- Action Buttons -->
      <circle cx="250" cy="300" r="14" fill="url(#metal-grad)"/>
      <circle cx="250" cy="300" r="10" fill="#FF0055"/>
      <text x="250" y="304" font-family="sans-serif" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle">A</text>

      <circle cx="220" cy="330" r="14" fill="url(#metal-grad)"/>
      <circle cx="220" cy="330" r="10" fill="#AA00FF"/>
      <text x="220" y="334" font-family="sans-serif" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle">B</text>

      <!-- Start/Select Pills -->
      <rect x="140" y="355" width="24" height="8" rx="4" fill="#718096" transform="rotate(-20 140 355)"/>
      <rect x="175" y="355" width="24" height="8" rx="4" fill="#718096" transform="rotate(-20 175 355)"/>
      
      <!-- Speaker Vents -->
      <g fill="#0D1117">
        <circle cx="260" cy="360" r="2.5"/>
        <circle cx="270" cy="360" r="2.5"/>
        <circle cx="255" cy="368" r="2.5"/>
        <circle cx="265" cy="368" r="2.5"/>
        <circle cx="275" cy="368" r="2.5"/>
        <circle cx="260" cy="376" r="2.5"/>
        <circle cx="270" cy="376" r="2.5"/>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: VIBEGAMES.NINJA BRANDING            -->
  <!-- ========================================== -->
  <g transform="translate(360, 220)">
    
    <!-- Neon Slash Background behind text -->
    <path d="M -20 10 L 460 10 L 440 -15 L -40 -15 Z" fill="#FF0055" opacity="0.15"/>
    <path d="M -30 20 L 450 20 L 440 10 L -40 10 Z" fill="#00E5FF" opacity="0.15"/>

    <!-- "VIBE GAMES" text -->
    <text x="0" y="0" class="font-vibe">VIBE</text>
    <text x="225" y="0" class="font-games" text-shadow="4px 4px 0px rgba(0,0,0,0.5)">GAMES</text>
    
    <!-- Cyberpunk Decorative Elements -->
    <g transform="translate(0, 45)">
      <!-- ".NINJA" text -->
      <text x="0" y="0" class="font-ninja">.NINJA</text>
      
      <!-- Digital Barcode / Accents -->
      <rect x="180" y="-22" width="8" height="24" fill="#FF0055"/>
      <rect x="192" y="-22" width="4" height="24" fill="#00E5FF"/>
      <rect x="200" y="-22" width="12" height="24" fill="#AA00FF"/>
      <rect x="216" y="-22" width="4" height="24" fill="#FF0055"/>
      
      <path d="M 240 -10 L 420 -10" stroke="#2D3748" stroke-width="4" stroke-dasharray="12 6" stroke-linecap="round"/>
      <circle cx="435" cy="-10" r="6" fill="#00E5FF"/>
    </g>

  </g>
</svg>