<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harbor Pilot</title>
    <style>
        :root {
            --color-sea: #709dbd;
            --color-sand: #e9dcc9;
            --color-slate: #708090;
            --color-rust: #b7410e;
            --color-cream: #f5f5dc;
            --color-wood: #8b4513;
            --color-text: #2c3e50;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-sea);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--color-text);
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            background-color: var(--color-sea);
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        .hud-item {
            background: rgba(245, 245, 220, 0.8);
            padding: 8px 15px;
            border-radius: 4px;
            border: 2px solid var(--color-slate);
        }

        .menu-screen {
            pointer-events: auto;
            background: rgba(245, 245, 220, 0.95);
            padding: 40px;
            border-radius: 8px;
            border: 4px solid var(--color-slate);
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-top: 0;
            color: var(--color-rust);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--color-slate);
            padding-bottom: 10px;
        }

        .btn {
            background: var(--color-rust);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.1s, background 0.2s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #d35400;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        .combo-popup {
            position: absolute;
            color: var(--color-rust);
            font-weight: bold;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .joystick-area {
            width: 120px;
            height: 120px;
            background: rgba(245, 245, 220, 0.3);
            border-radius: 50%;
            border: 2px solid rgba(112, 128, 144, 0.5);
            position: relative;
            pointer-events: auto;
        }

        .joystick-knob {
            width: 50px;
            height: 50px;
            background: var(--color-slate);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="hud" id="hud">
        <div class="hud-item">SCORE: <span id="scoreVal">0</span></div>
        <div class="hud-item" id="streakBox">STREAK: x<span id="streakVal">1</span></div>
        <div class="hud-item">LIVES: <span id="livesVal">3</span></div>
    </div>

    <div class="ui-overlay">
        <!-- Start Screen -->
        <div id="startScreen" class="menu-screen">
            <h1>Harbor Pilot</h1>
            <p>Navigate the coastal waters, collect cargo, and deliver it to the highlighted piers.</p>
            <div class="controls-hint">
                <b>Desktop:</b> ARROWS or WASD to steer<br>
                <b>Mobile:</b> Touch and drag anywhere to steer
            </div>
            <button class="btn" onclick="game.start()">Begin Shift</button>
            <p id="highScoreText" style="margin-top: 15px; font-size: 0.85rem;"></p>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="menu-screen hidden">
            <h1>Shift Ended</h1>
            <p>Your performance in the harbor has concluded.</p>
            <p style="font-size: 1.5rem; font-weight: bold;">Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="game.start()">Restart Shift</button>
        </div>
    </div>

    <div id="mobile-controls" class="hidden">
        <div class="joystick-area" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game constants and state
    const game = {
        active: false,
        score: 0,
        lives: 3,
        streak: 1,
        streakTimer: 0,
        difficulty: 1,
        highScore: Number(localStorage.getItem('harborPilot_highScore') || 0),
        
        init() {
            this.resize();
            window.addEventListener('resize', () => this.resize());
            document.getElementById('highScoreText').innerText = `Best Shift: ${this.highScore}`;
            
            // Input handling
            window.addEventListener('keydown', e => input.handleKey(e, true));
            window.addEventListener('keyup', e => input.handleKey(e, false));
            
            // Mouse/Touch steering
            canvas.addEventListener('mousedown', e => input.handleTouch(e, true));
            canvas.addEventListener('mousemove', e => input.handleTouch(e, true));
            window.addEventListener('mouseup', () => input.touchActive = false);
            
            canvas.addEventListener('touchstart', e => input.handleTouch(e, true), {passive: false});
            canvas.addEventListener('touchmove', e => input.handleTouch(e, true), {passive: false});
            window.addEventListener('touchend', () => input.touchActive = false);

            this.loop();
        },

        resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.getElementById('mobile-controls').classList.add('hidden');
        },

        start() {
            this.active = true;
            this.score = 0;
            this.lives = 3;
            this.streak = 1;
            this.streakTimer = 0;
            this.difficulty = 1;
            
            world.reset();
            player.reset();
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            this.updateHUD();
        },

        gameOver() {
            this.active = false;
            if (this.score > this.highScore) {
                this.highScore = this.score;
                localStorage.setItem('harborPilot_highScore', this.highScore);
            }
            document.getElementById('finalScore').innerText = this.score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('highScoreText').innerText = `Best Shift: ${this.highScore}`;
        },

        updateHUD() {
            document.getElementById('scoreVal').innerText = Math.floor(this.score);
            document.getElementById('livesVal').innerText = this.lives;
            document.getElementById('streakVal').innerText = this.streak;
            
            const streakBox = document.getElementById('streakBox');
            if (this.streak > 1) {
                streakBox.style.color = 'var(--color-rust)';
                streakBox.style.transform = `scale(${1 + this.streak * 0.05})`;
            } else {
                streakBox.style.color = 'inherit';
                streakBox.style.transform = 'scale(1)';
            }
        },

        loop() {
            this.update();
            this.draw();
            requestAnimationFrame(() => this.loop());
        },

        update() {
            if (!this.active) return;

            player.update();
            world.update();

            // Streak decay
            if (this.streakTimer > 0) {
                this.streakTimer--;
            } else if (this.streak > 1) {
                this.streak = 1;
                this.updateHUD();
            }

            // Difficulty scaling
            this.difficulty = 1 + (this.score / 5000);
        },

        draw() {
            // Draw Background (Sea)
            ctx.fillStyle = '#709dbd';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw World
            world.draw();

            // Draw Player
            player.draw();

            if (!this.active) {
                // Subtle overlay when menu is open
                ctx.fillStyle = 'rgba(112, 128, 144, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
    };

    const input = {
        keys: {},
        touchActive: false,
        touchX: 0,
        touchY: 0,

        handleKey(e, state) {
            this.keys[e.code] = state;
            this.keys[e.key] = state;
        },

        handleTouch(e, state) {
            this.touchActive = state;
            const t = e.touches ? e.touches[0] : e;
            this.touchX = t.clientX;
            this.touchY = t.clientY;
            if (e.touches) e.preventDefault();
        }
    };

    const player = {
        x: 0,
        y: 0,
        angle: 0,
        vx: 0,
        vy: 0,
        speed: 0,
        accel: 0.12,
        friction: 0.98,
        turnSpeed: 0.05,
        width: 40,
        height: 20,
        cargo: null,
        invuln: 0,

        reset() {
            this.x = canvas.width / 2;
            this.y = canvas.height / 2;
            this.angle = -Math.PI / 2;
            this.vx = 0;
            this.vy = 0;
            this.speed = 0;
            this.cargo = null;
            this.invuln = 60;
        },

        update() {
            // Steering
            let turning = 0;
            if (input.keys['ArrowLeft'] || input.keys['a'] || input.keys['A']) turning = -1;
            if (input.keys['ArrowRight'] || input.keys['d'] || input.keys['D']) turning = 1;

            if (input.touchActive) {
                const dx = input.touchX - this.x;
                const dy = input.touchY - this.y;
                const targetAngle = Math.atan2(dy, dx);
                let diff = targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                turning = Math.max(-1, Math.min(1, diff * 5));
            }

            this.angle += turning * this.turnSpeed * (Math.abs(this.speed) > 0.1 ? 1 : 0.5);

            // Propulsion
            let move = 0;
            if (input.keys['ArrowUp'] || input.keys['w'] || input.keys['W']) move = 1;
            if (input.keys['ArrowDown'] || input.keys['s'] || input.keys['S']) move = -0.5;
            
            if (input.touchActive) move = 0.8; // Auto-forward on touch

            this.speed += move * this.accel;
            this.speed *= this.friction;

            this.vx = Math.cos(this.angle) * this.speed;
            this.vy = Math.sin(this.angle) * this.speed;

            this.x += this.vx;
            this.y += this.vy;

            // Boundary collision
            if (this.x < 20) { this.x = 20; this.speed *= -0.5; }
            if (this.x > canvas.width - 20) { this.x = canvas.width - 20; this.speed *= -0.5; }
            if (this.y < 20) { this.y = 20; this.speed *= -0.5; }
            if (this.y > canvas.height - 20) { this.y = canvas.height - 20; this.speed *= -0.5; }

            if (this.invuln > 0) this.invuln--;
        },

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            if (this.invuln > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Wake
            if (Math.abs(this.speed) > 0.5) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.moveTo(-20, 0);
                ctx.lineTo(-40 - Math.random() * 10, -10);
                ctx.lineTo(-40 - Math.random() * 10, 10);
                ctx.fill();
            }

            // Hull
            ctx.fillStyle = 'var(--color-rust)';
            ctx.beginPath();
            ctx.moveTo(25, 0);
            ctx.lineTo(-15, -12);
            ctx.lineTo(-20, -10);
            ctx.lineTo(-20, 10);
            ctx.lineTo(-15, 12);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Deck
            ctx.fillStyle = 'var(--color-cream)';
            ctx.fillRect(-10, -7, 15, 14);
            ctx.strokeRect(-10, -7, 15, 14);

            // Cabin
            ctx.fillStyle = 'var(--color-slate)';
            ctx.fillRect(-5, -5, 8, 10);

            // Cargo display
            if (this.cargo) {
                ctx.fillStyle = 'var(--color-wood)';
                ctx.fillRect(-18, -6, 10, 12);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(-18, -6, 10, 12);
            }

            ctx.restore();
        }
    };

    const world = {
        obstacles: [],
        cargoItems: [],
        piers: [],
        driftingBoats: [],
        particles: [],

        reset() {
            this.obstacles = [];
            this.cargoItems = [];
            this.piers = [];
            this.driftingBoats = [];
            
            // Generate Piers
            const pierCount = 3;
            for (let i = 0; i < pierCount; i++) {
                this.piers.push({
                    x: (i + 1) * (canvas.width / (pierCount + 1)),
                    y: (i % 2 === 0) ? 40 : canvas.height - 40,
                    w: 80,
                    h: 40,
                    active: false,
                    id: i
                });
            }

            // Initial Obstacles
            for (let i = 0; i < 8; i++) this.spawnObstacle();
            
            // Initial Cargo
            this.spawnCargo();
        },

        spawnObstacle() {
            const type = Math.random() > 0.7 ? 'buoy' : 'rock';
            let x, y, tooClose;
            do {
                x = Math.random() * (canvas.width - 100) + 50;
                y = Math.random() * (canvas.height - 100) + 50;
                tooClose = Math.hypot(x - canvas.width / 2, y - canvas.height / 2) < 150;
            } while (tooClose);

            this.obstacles.push({ x, y, r: type === 'rock' ? 20 + Math.random() * 15 : 10, type });
        },

        spawnCargo() {
            let x, y, tooClose;
            do {
                x = Math.random() * (canvas.width - 100) + 50;
                y = Math.random() * (canvas.height - 100) + 50;
                tooClose = Math.hypot(x - player.x, y - player.y) < 100;
            } while (tooClose);
            this.cargoItems.push({ x, y, r: 15 });
        },

        spawnDriftingBoat() {
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            if (side === 0) { x = -50; y = Math.random() * canvas.height; vx = 0.5; vy = (Math.random() - 0.5) * 0.5; }
            else if (side === 1) { x = canvas.width + 50; y = Math.random() * canvas.height; vx = -0.5; vy = (Math.random() - 0.5) * 0.5; }
            else if (side === 2) { x = Math.random() * canvas.width; y = -50; vx = (Math.random() - 0.5) * 0.5; vy = 0.5; }
            else { x = Math.random() * canvas.width; y = canvas.height + 50; vx = (Math.random() - 0.5) * 0.5; vy = -0.5; }

            this.driftingBoats.push({
                x, y, vx, vy, 
                angle: Math.atan2(vy, vx),
                w: 35, h: 15
            });
        },

        update() {
            // Chance to spawn drifting boat based on difficulty
            if (Math.random() < 0.005 * game.difficulty && this.driftingBoats.length < 5) {
                this.spawnDriftingBoat();
            }

            // Update drifting boats
            this.driftingBoats.forEach((b, index) => {
                b.x += b.vx * game.difficulty;
                b.y += b.vy * game.difficulty;
                
                // Collision with player
                if (player.invuln === 0 && Math.hypot(player.x - b.x, player.y - b.y) < 30) {
                    this.handleCollision();
                    this.driftingBoats.splice(index, 1);
                }

                if (b.x < -100 || b.x > canvas.width + 100 || b.y < -100 || b.y > canvas.height + 100) {
                    this.driftingBoats.splice(index, 1);
                }
            });

            // Obstacle collisions
            this.obstacles.forEach(o => {
                const dist = Math.hypot(player.x - o.x, player.y - o.y);
                if (player.invuln === 0 && dist < o.r + 15) {
                    this.handleCollision();
                }
            });

            // Cargo collection
            this.cargoItems.forEach((c, index) => {
                if (!player.cargo && Math.hypot(player.x - c.x, player.y - c.y) < 30) {
                    player.cargo = c;
                    this.cargoItems.splice(index, 1);
                    // Activate a random pier
                    const pier = this.piers[Math.floor(Math.random() * this.piers.length)];
                    pier.active = true;
                }
            });

            // Pier delivery
            this.piers.forEach(p => {
                if (p.active && player.cargo) {
                    const inX = player.x > p.x - p.w/2 && player.x < p.x + p.w/2;
                    const inY = player.y > p.y - p.h/2 && player.y < p.y + p.h/2;
                    if (inX && inY) {
                        this.deliverCargo(p);
                    }
                }
            });

            // Particles
            this.particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) this.particles.splice(i, 1);
            });
        },

        handleCollision() {
            game.lives--;
            player.invuln = 120;
            player.speed *= -0.8;
            game.streak = 1;
            game.updateHUD();
            this.createExplosion(player.x, player.y, 'var(--color-rust)');
            if (game.lives <= 0) game.gameOver();
        },

        deliverCargo(pier) {
            const points = 500 * game.streak;
            game.score += points;
            game.streak++;
            game.streakTimer = 300; // 5 seconds at 60fps
            player.cargo = null;
            pier.active = false;
            this.spawnCargo();
            game.updateHUD();
            this.createExplosion(pier.x, pier.y, 'white');
            
            // Popup
            const popup = document.createElement('div');
            popup.className = 'combo-popup';
            popup.innerText = `+${points}`;
            popup.style.left = `${player.x}px`;
            popup.style.top = `${player.y}px`;
            document.getElementById('game-container').appendChild(popup);
            setTimeout(() => popup.remove(), 1000);

            // Increase density
            if (this.obstacles.length < 20) this.spawnObstacle();
        },

        createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                this.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 30 + Math.random() * 20,
                    color
                });
            }
        },

        draw() {
            // Draw Sand/Beaches
            ctx.fillStyle = 'var(--color-sand)';
            ctx.fillRect(0, 0, canvas.width, 15);
            ctx.fillRect(0, canvas.height - 15, canvas.width, 15);

            // Draw Piers
            this.piers.forEach(p => {
                ctx.fillStyle = p.active ? '#fff' : 'var(--color-slate)';
                if (p.active) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = 'white';
                }
                ctx.fillRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h);
                ctx.shadowBlur = 0;
                
                // Pier details
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                for (let i = -p.w/2 + 10; i < p.w/2; i += 15) {
                    ctx.beginPath();
                    ctx.moveTo(p.x + i, p.y - p.h/2);
                    ctx.lineTo(p.x + i, p.y + p.h/2);
                    ctx.stroke();
                }
            });

            // Draw Cargo Items
            this.cargoItems.forEach(c => {
                ctx.fillStyle = 'var(--color-wood)';
                ctx.fillRect(c.x - 10, c.y - 10, 20, 20);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.strokeRect(c.x - 10, c.y - 10, 20, 20);
                // Floating effect
                ctx.beginPath();
                ctx.arc(c.x, c.y, 25 + Math.sin(Date.now() / 200) * 5, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
            });

            // Draw Obstacles
            this.obstacles.forEach(o => {
                if (o.type === 'rock') {
                    ctx.fillStyle = 'var(--color-slate)';
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
                    ctx.fill();
                    // Rock detail
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.arc(o.x - o.r*0.3, o.y - o.r*0.3, o.r*0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'var(--color-rust)';
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.fillRect(o.x - 2, o.y - o.r, 4, o.r * 2);
                }
            });

            // Draw Drifting Boats
            this.driftingBoats.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle);
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.moveTo(b.w/2, 0);
                ctx.lineTo(-b.w/2, -b.h/2);
                ctx.lineTo(-b.w/2, b.h/2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Draw Particles
            this.particles.forEach(p => {
                ctx.globalAlpha = p.life / 50;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;
        }
    };

    // Initialize the game
    game.init();

</script>
</body>
</html>
