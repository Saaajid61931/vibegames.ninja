<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Breakout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            background: #111;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 12px;
            z-index: 10;
        }
        
        .score-box, .lives-box, .level-box {
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border: 2px solid #444;
        }
        
        .score-box { color: #ff0; border-color: #ff0; }
        .lives-box { color: #f0f; border-color: #f0f; }
        .level-box { color: #0ff; border-color: #0ff; }
        
        #startScreen, #gameOverScreen, #levelComplete {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            color: #fff;
        }
        
        .title {
            font-size: clamp(20px, 5vw, 36px);
            color: #ff0;
            text-shadow: 3px 3px 0 #f0f, -3px -3px 0 #0ff;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
        
        .subtitle {
            font-size: 10px;
            color: #888;
            margin-bottom: 30px;
        }
        
        .final-score {
            font-size: clamp(30px, 8vw, 48px);
            color: #0ff;
            margin: 20px 0;
        }
        
        .play-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            padding: 15px 30px;
            background: #0f0;
            border: none;
            color: #000;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        
        .play-btn:hover { transform: scale(1.1); }
        .play-btn:active { transform: scale(0.95); }
        
        .instructions {
            margin-top: 30px;
            font-size: 8px;
            color: #666;
            text-align: center;
            line-height: 2;
        }
        
        .brick-preview {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin: 20px 0;
        }
        
        .brick {
            width: 20px;
            height: 12px;
        }
        
        .hidden { display: none !important; }
        
        .powerup {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: fall 3s linear forwards;
        }
        
        @keyframes fall {
            to { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="level-box">LEVEL: <span id="level">1</span></div>
        <div class="lives-box">LIVES: <span id="lives">3</span></div>
    </div>
    
    <div id="startScreen">
        <div class="title">RETRO BREAKOUT</div>
        <div class="subtitle">Classic arcade action!</div>
        
        <div class="brick-preview">
            <div class="brick" style="background:#f00"></div>
            <div class="brick" style="background:#f80"></div>
            <div class="brick" style="background:#ff0"></div>
            <div class="brick" style="background:#0f0"></div>
            <div class="brick" style="background:#00f"></div>
            <div class="brick" style="background:#40f"></div>
            <div class="brick" style="background:#f0f"></div>
            <div class="brick" style="background:#fff"></div>
        </div>
        
        <button class="play-btn" onclick="startGame()">START GAME</button>
        
        <div class="instructions">
            DESKTOP: Mouse to move paddle<br>
            MOBILE: Touch and drag<br>
            <br>
            Break all bricks to advance!<br>
            Catch powerups for bonuses!
        </div>
    </div>
    
    <div id="gameOverScreen" class="hidden">
        <div class="title">GAME OVER</div>
        <div class="final-score" id="finalScore">0</div>
        <div style="color:#888;font-size:10px">HIGH SCORE: <span id="highScore">0</span></div>
        <button class="play-btn" onclick="startGame()">TRY AGAIN</button>
    </div>
    
    <div id="levelComplete" class="hidden">
        <div class="title" style="color:#0f0">LEVEL COMPLETE!</div>
        <div class="final-score" id="levelScore">0</div>
        <button class="play-btn" onclick="nextLevel()">NEXT LEVEL</button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let paddle, ball, bricks = [], powerups = [];
        let score = 0, lives = 3, level = 1;
        let highScore = parseInt(localStorage.getItem('breakoutHigh')) || 0;
        let gameRunning = false;
        let mouseX = 0;
        
        const BRICK_ROWS = 6;
        const BRICK_COLS = 8;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            if (paddle) {
                paddle.width = Math.min(120, width * 0.25);
                paddle.y = height - 40;
            }
        }
        
        function initGame() {
            score = 0;
            lives = 3;
            level = 1;
            
            paddle = {
                x: width / 2,
                y: height - 40,
                width: Math.min(120, width * 0.25),
                height: 15,
                speed: 0
            };
            
            ball = {
                x: width / 2,
                y: height - 60,
                radius: 8,
                dx: 4,
                dy: -4,
                speed: 5
            };
            
            createBricks();
            powerups = [];
        }
        
        function createBricks() {
            bricks = [];
            const padding = 5;
            const brickWidth = (width - padding * 2) / BRICK_COLS - padding;
            const brickHeight = 20;
            const topOffset = 60;
            
            const colors = ['#f00', '#f80', '#ff0', '#0f0', '#00f', '#40f', '#f0f', '#fff'];
            
            for (let row = 0; row < BRICK_ROWS; row++) {
                for (let col = 0; col < BRICK_COLS; col++) {
                    const brick = {
                        x: padding + col * (brickWidth + padding),
                        y: topOffset + row * (brickHeight + padding),
                        width: brickWidth,
                        height: brickHeight,
                        color: colors[col % colors.length],
                        alive: true,
                        points: (BRICK_ROWS - row) * 10
                    };
                    
                    if (Math.random() < 0.05 * level) {
                        brick.powerup = true;
                    }
                    
                    bricks.push(brick);
                }
            }
        }
        
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('levelComplete').classList.add('hidden');
            
            initGame();
            gameRunning = true;
            updateUI();
            gameLoop();
        }
        
        function nextLevel() {
            document.getElementById('levelComplete').classList.add('hidden');
            level++;
            ball.speed = Math.min(10, 5 + level * 0.5);
            createBricks();
            resetBall();
            gameRunning = true;
            updateUI();
        }
        
        function resetBall() {
            ball.x = width / 2;
            ball.y = height - 60;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed * 0.7;
            ball.dy = -ball.speed;
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }
        
        function update() {
            if (!gameRunning) return;
            
            // Move paddle toward mouse/touch
            const targetX = Math.max(paddle.width/2, Math.min(width - paddle.width/2, mouseX));
            paddle.x += (targetX - paddle.x) * 0.2;
            
            // Move ball
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Wall collisions
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > width) {
                ball.dx *= -1;
                ball.x = Math.max(ball.radius, Math.min(width - ball.radius, ball.x));
            }
            if (ball.y - ball.radius < 0) {
                ball.dy *= -1;
                ball.y = ball.radius;
            }
            
            // Paddle collision
            if (ball.y + ball.radius > paddle.y && 
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x - paddle.width/2 && 
                ball.x < paddle.x + paddle.width/2) {
                
                const hitPos = (ball.x - paddle.x) / (paddle.width/2);
                const angle = hitPos * Math.PI / 3;
                
                ball.dx = Math.sin(angle) * ball.speed;
                ball.dy = -Math.cos(angle) * ball.speed;
                ball.y = paddle.y - ball.radius;
            }
            
            // Ball fell
            if (ball.y > height) {
                lives--;
                updateUI();
                
                if (lives <= 0) {
                    gameOver();
                    return;
                } else {
                    resetBall();
                }
            }
            
            // Brick collisions
            for (let brick of bricks) {
                if (!brick.alive) continue;
                
                if (ball.x + ball.radius > brick.x && 
                    ball.x - ball.radius < brick.x + brick.width &&
                    ball.y + ball.radius > brick.y && 
                    ball.y - ball.radius < brick.y + brick.height) {
                    
                    brick.alive = false;
                    score += brick.points;
                    
                    // Determine bounce direction
                    const overlapLeft = ball.x + ball.radius - brick.x;
                    const overlapRight = brick.x + brick.width - (ball.x - ball.radius);
                    const overlapTop = ball.y + ball.radius - brick.y;
                    const overlapBottom = brick.y + brick.height - (ball.y - ball.radius);
                    
                    const minOverlapX = Math.min(overlapLeft, overlapRight);
                    const minOverlapY = Math.min(overlapTop, overlapBottom);
                    
                    if (minOverlapX < minOverlapY) {
                        ball.dx *= -1;
                    } else {
                        ball.dy *= -1;
                    }
                    
                    // Spawn powerup
                    if (brick.powerup && Math.random() < 0.3) {
                        spawnPowerup(brick.x + brick.width/2, brick.y + brick.height);
                    }
                    
                    updateUI();
                }
            }
            
            // Check level complete
            if (bricks.every(b => !b.alive)) {
                levelComplete();
                return;
            }
            
            // Update powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += 2;
                
                // Paddle collision
                if (p.y > paddle.y && p.y < paddle.y + paddle.height &&
                    p.x > paddle.x - paddle.width/2 && p.x < paddle.x + paddle.width/2) {
                    
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                    continue;
                }
                
                if (p.y > height) {
                    powerups.splice(i, 1);
                }
            }
        }
        
        function spawnPowerup(x, y) {
            const types = ['wide', 'multi', 'slow', 'life'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({ x, y, type });
        }
        
        function applyPowerup(type) {
            switch(type) {
                case 'wide':
                    paddle.width = Math.min(200, paddle.width * 1.5);
                    setTimeout(() => paddle.width = Math.min(120, width * 0.25), 10000);
                    break;
                case 'multi':
                    // Extra ball (simplified - just bonus points)
                    score += 100;
                    break;
                case 'slow':
                    ball.speed = Math.max(3, ball.speed * 0.7);
                    setTimeout(() => ball.speed = Math.min(10, 5 + level * 0.5), 5000);
                    break;
                case 'life':
                    lives = Math.min(5, lives + 1);
                    updateUI();
                    break;
            }
        }
        
        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);
            
            // Draw bricks
            for (let brick of bricks) {
                if (!brick.alive) continue;
                
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                
                // Shine effect
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height/2);
                
                // Border
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
            }
            
            // Draw paddle
            ctx.fillStyle = '#0ff';
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 15;
            ctx.fillRect(paddle.x - paddle.width/2, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;
            
            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Draw powerups
            const powerColors = {
                'wide': '#0f0',
                'multi': '#ff0',
                'slow': '#00f',
                'life': '#f0f'
            };
            
            for (let p of powerups) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = powerColors[p.type];
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.font = '10px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const symbols = { 'wide': 'W', 'multi': 'M', 'slow': 'S', 'life': 'L' };
                ctx.fillText(symbols[p.type], p.x, p.y);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('breakoutHigh', highScore);
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
        
        function levelComplete() {
            gameRunning = false;
            document.getElementById('levelScore').textContent = score;
            document.getElementById('levelComplete').classList.remove('hidden');
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Controls
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouseX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseX = e.touches[0].clientX;
        }, { passive: false });
        
        window.addEventListener('resize', resize);
        resize();
        resize();
        
        document.getElementById('highScore').textContent = highScore;
    </script>
</body>
</html>
